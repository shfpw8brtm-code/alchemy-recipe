<style>
:root{
  --bg:#f7f4fa;--paper:#fff;--ink:#292333;--muted:#746b7d;
  --accent:#7654a3;--accent-dark:#56377e;--line:#e4dbea;
  --soft:#eee6f6;--good:#e8f5ed;--shadow:0 5px 18px #3c28500c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.5}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
#app{max-width:620px;min-height:100dvh;margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.brand{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.round-tag{font-size:12px;color:var(--accent-dark);background:var(--soft);padding:5px 10px;border-radius:999px}
main{flex:1}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(27px,7vw,38px);line-height:1.25;text-align:center;margin:16px 0 10px}
h2{font-size:24px;line-height:1.3;margin-bottom:8px}
h3{font-size:17px;margin-bottom:8px}
p{margin-bottom:12px}
.sub{color:var(--muted);font-size:14px}
.center{text-align:center}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin:14px 0}
.hero{padding:30px 20px;text-align:center;margin-top:9vh}
.emoji-title{font-size:46px;letter-spacing:.12em;margin:12px 0}
button.primary,button.secondary,button.ghost{width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:750;min-height:50px}
button.primary{background:var(--accent);color:#fff}
button.primary:active{background:var(--accent-dark)}
button.secondary{background:var(--soft);color:var(--accent-dark);border:1px solid #dfd1ed}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.stack{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row>*{min-width:0}
.row.between{justify-content:space-between}
.counter{display:flex;align-items:center;gap:15px}
.counter button{width:44px;height:44px;border:1px solid var(--line);background:var(--soft);color:var(--accent-dark);border-radius:12px;font-size:23px;font-weight:700}
.counter strong{font-size:24px;min-width:28px;text-align:center}
.field{display:grid;gap:6px;margin:12px 0}
label{font-size:14px;font-weight:700}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink);min-height:46px}
.player-row{display:grid;grid-template-columns:30px 1fr 42px;gap:8px;align-items:center;margin:8px 0}
.player-row .num{color:var(--muted);font-size:13px;text-align:center}
.player-row button{height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#9d3c53;font-size:20px}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.material{min-height:112px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;color:var(--ink)}
.material .emoji{font-size:28px}
.material .name{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.material.selected{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 2px #7654a31c}
.full{grid-column:1/-1}
.big-emoji{font-size:44px;text-align:center;margin:8px 0}
.notice{background:var(--soft);border-radius:16px;padding:16px;text-align:center}
.hidden{display:none!important}
.fade{animation:fadeIn .75s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.name-part{padding:12px;border-bottom:1px solid var(--line);font-size:20px;font-weight:750;text-align:center;animation:fadeIn .65s ease both}
.name-part:last-child{border-bottom:0}
.potion-name{font-size:24px;font-weight:850;text-align:center;overflow-wrap:anywhere;padding:14px 4px}
.effect-text{font-size:17px;line-height:1.7;text-align:center;font-weight:700}
.vote-option{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;text-align:left;color:var(--ink);margin:8px 0;min-height:66px}
.vote-option.selected{border-color:var(--accent);background:var(--soft)}
.vote-option .material-emoji{font-size:25px}
.vote-option .vote-name{font-weight:750}
.vote-option .vote-material{font-size:13px;color:var(--muted)}
.vote-option .mark{margin-left:auto;font-size:20px;color:var(--accent)}
.score-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.score-row:last-child{border-bottom:0}
.score{font-weight:800;color:var(--accent-dark);white-space:nowrap}
.small{font-size:12px;color:var(--muted)}
footer{padding-top:14px;text-align:center;color:var(--muted);font-size:11px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(min-width:520px){.choice-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.material{min-height:125px}}
@media(prefers-reduced-motion:reduce){.fade,.name-part{animation:none}}
</style>
</head>

"あらゆる本のしおりが最適なページを選ぶ",
"一日だけ地球の重力が拍手に反応する",
"全ての自転車ベルが丁寧な挨拶をする",
"冷たい飲み物を飲むと脳内に雪景色が広がる",
"一日だけ自分のあだ名が世界共通語になる",
"どんなゲームでも開始時に実況が入る",
"世界中のベンチが座った人に小話をする",
"一日だけ雨が地面に着くと拍手する",
"全てのドーナツに個性豊かな性格診断がつく",
"一度だけ昨日の自分からアドバイスが届く"
];
const $ = id => document.getElementById(id);
const screen = $("screen");
const state = {
  rounds:3, names:["研究者A","研究者B"], orderMode:"registration",
  round:1, players:[], turnOrder:[], picks:[], assignedParts:[], effect:"",
  usedMaterials:[], usedNameParts:[], usedEffects:[],
  selectedMaterial:null, revealIndex:0, revealMode:"record", isRevealing:false, showEffect:false, voters:[], voteIndex:0,
  votes:[], scores:{}, history:[], selectedVote:null
};
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function btn(label,fn,kind="primary",disabled=false){return `<button class="${kind}" data-action="${fn}" ${disabled?"disabled":""}>${label}</button>`;}
function setScreen(html,tag=""){screen.innerHTML=html;$("roundTag").textContent=tag;$("roundTag").classList.toggle("hidden",!tag);window.scrollTo({top:0,behavior:"smooth"});}
function titleScreen(){setScreen(`<section class="panel hero">
<div class="emoji-title">⚗️ 🧪 ✨</div>
<h1>錬金術師の<br>レシピ</h1>
<p class="sub">材料を混ぜて、へんてこな薬をつくろう！</p>
<div class="stack" style="margin-top:26px">${btn("はじめる","setup")}</div>
</section>`);}
function setupScreen(){
 const rows=state.names.map((n,i)=>`<div class="player-row"><span class="num">${i+1}</span><input type="text" maxlength="10" data-name-index="${i}" aria-label="プレイヤー${i+1}の名前" value="${esc(n)}" placeholder="プレイヤー名"><button data-action="remove-player" data-index="${i}" aria-label="削除" ${state.names.length<=2?"disabled":""}>×</button></div>`).join("");
 setScreen(`<h2>ゲームの準備</h2><p class="sub">遊び方を設定して、錬金術を始めよう。</p>
 <section class="panel"><div class="row between"><div><h3>ラウンド数</h3><p class="sub">何回薬をつくる？</p></div><div class="counter"><button data-action="round-minus" aria-label="ラウンド数を減らす">−</button><strong>${state.rounds}</strong><button data-action="round-plus" aria-label="ラウンド数を増やす">＋</button></div></div></section>
 <section class="panel"><div class="row between"><div><h3>プレイヤー登録</h3><p class="sub">名前は10文字以内（2〜5人）</p></div><span class="round-tag">${state.names.length}/5人</span></div>
 ${rows}${btn("＋ プレイヤーを追加","add-player","secondary",state.names.length>=5)}
 </section>
 <section class="panel"><h3>プレイ順</h3><div class="stack">
 <button class="${state.orderMode==="registration"?"primary":"ghost"}" data-action="order-registration">プレイヤー登録順</button>
 <button class="${state.orderMode==="random"?"primary":"ghost"}" data-action="order-random">ランダム（ラウンドごとに変更）</button>
 </div></section>
 <div class="stack">${btn("薬をつくる","start-game")}</div>`);
}
function passScreen(name,buttonLabel,action,sub="次の人にスマホを渡してください。"){
 setScreen(`<section class="panel hero" style="margin-top:7vh"><div class="big-emoji">🔒</div><h2>${esc(name)}だけ<br>画面を見てください</h2><p class="sub">${esc(sub)}</p><div class="stack">${btn(buttonLabel,action)}</div></section>`,`第${state.round}/${state.rounds}ラウンド`);
}
function startGame(){
 // Commit any currently focused name before transitioning.
 document.querySelectorAll("[data-name-index]").forEach(el=>{const i=Number(el.dataset.nameIndex);state.names[i]=el.value.trim().slice(0,10)||`研究者${i+1}`;});
 state.names=state.names.slice(0,5);
 state.players=state.names.map((name,i)=>({id:i,name:name.trim()||`研究者${i+1}`,score:0,roundScores:[]}));
 state.players.forEach(p=>{p.score=0;p.roundScores=[];});
 state.scores={};state.history=[];state.round=1;
 state.usedMaterials=[];state.usedNameParts=[];state.usedEffects=[];
 beginRound();
}
function beginRound(){
 state.turnOrder=state.orderMode==="random"?shuffle(state.players.map(p=>p.id)):state.players.map(p=>p.id);
 state.picks=[];state.selectedMaterial=null;state.assignedParts=[];state.effect="";
 state.voters=[...state.turnOrder];state.votes=[];state.voteIndex=0;state.selectedVote=null;
 const first=playerById(state.turnOrder[0]);
 passScreen(first.name,"材料を選ぶ","show-materials","自分の番になったらボタンを押してね。");
}
function playerById(id){return state.players.find(p=>p.id===id);}
function currentPicker(){return playerById(state.turnOrder[state.picks.length]);}
function showMaterials(){
 const used=new Set(state.usedMaterials);
 const pool=MATERIALS.filter(m=>!used.has(m[0]));
 if(pool.length<5){setScreen(`<section class="panel"><h2>材料が足りません</h2><p>このラウンドで使える材料が5枚未満になりました。</p>${btn("戻る","setup","secondary")}</section>`);return;}
 const options=shuffle(pool).slice(0,5);
 state.currentOptions=options;
 state.selectedMaterial=null;
 setScreen(`<h2>材料を選ぼう！</h2><p class="sub center">${esc(currentPicker().name)}さんの番 · 1枚選択</p>
 <div class="choice-grid">${options.map((m,i)=>`<button class="material" data-action="select-material" data-index="${i}"><span class="emoji">${m[1]}</span><span class="name">${esc(m[0])}</span></button>`).join("")}</div>
 <div class="stack">${btn("材料にする","confirm-material","primary",true)}</div>`, `第${state.round}/${state.rounds}ラウンド`);
}
function confirmMaterial(){
 if(!state.selectedMaterial)return;
 const p=currentPicker();
 // A material card and its secret name fragment can only be used once per game.
 const availableParts=NAME_PARTS.filter(part=>!state.usedNameParts.includes(part));
 if(!availableParts.length){
   setScreen(`<section class="panel"><h2>名前パーツが足りません</h2><p>新しいゲームを始めてね。</p>${btn("タイトルへ","end-game")}</section>`);
   return;
 }
 const namePart=shuffle(availableParts)[0];
 state.usedMaterials.push(state.selectedMaterial.name);
 state.usedNameParts.push(namePart);
 state.picks.push({playerId:p.id,material:state.selectedMaterial,namePart});
 if(state.picks.length<state.players.length){
   const next=playerById(state.turnOrder[state.picks.length]);
   passScreen(next.name,"材料を選ぶ","show-materials","前の人の選んだ材料は秘密です。");
 }else{
   revealModeScreen();
 }
}
function revealModeScreen(){
 setScreen(`<section class="panel hero" style="margin-top:5vh"><div class="big-emoji">🧪</div><h2>完成した薬を<br>どうする？</h2><p class="sub">発表の順番が変わるよ！</p><div class="stack">${btn("📖 記録する","reveal-record")} ${btn("🥤 飲む","reveal-drink","secondary")}</div></section>`,`第${state.round}/${state.rounds}ラウンド`);
}
function prepareReveal(mode){
 state.revealMode=mode;
 state.assignedParts=state.picks.map(p=>({part:p.namePart}));
 const availableEffects=EFFECTS.filter(effect=>!state.usedEffects.includes(effect));
 if(availableEffects.length<2){
   setScreen(`<section class="panel"><h2>効果カードが足りません</h2><p>新しいゲームを始めてね。</p>${btn("タイトルへ","end-game")}</section>`);
   return;
 }
 state.effects=shuffle(availableEffects).slice(0,2);
 state.usedEffects.push(...state.effects);
 state.revealIndex=0;
 state.isRevealing=false;
 state.showEffect=false;
 renderReveal();
}
function renderReveal(){
 const record=state.revealMode==="record";
 const partsHtml=state.assignedParts.slice(0,state.revealIndex).map((x,i)=>`<div class="name-part" style="animation-delay:${i*.04}s">${esc(x.part)}</div>`).join("");
 const fullName=state.assignedParts.map(x=>x.part).join(" ")+" 薬";
 let body=`<section class="panel"><div class="center sub">${record?"📖 薬の記録":"🥤 薬を飲んでみた！"}</div>`;
 if(record){
   body+=`<h2 class="center">薬の名前</h2><div class="panel" style="padding:6px 14px">${partsHtml||'<p class="sub center">「薬に名前を付ける」を押してね。</p>'}</div>`;
   if(state.revealIndex>=state.assignedParts.length)body+=`<div class="potion-name fade">${esc(fullName)}</div>`;
   if(state.showEffect)body+=`<hr><h2 class="center">薬の効果</h2>${state.effects.map((effect,i)=>`<p class="effect-text fade">${i+1}. ${esc(effect)}</p>`).join("")}`;
 }else{
   body+=`<h2 class="center">薬の効果</h2>${state.effects.map((effect,i)=>`<p class="effect-text fade">${i+1}. ${esc(effect)}</p>`).join("")}`;
   if(state.revealIndex>0)body+=`<hr><h2 class="center">薬の名前</h2><div class="panel" style="padding:6px 14px">${partsHtml}</div>`;
   else body+=`<hr><h2 class="center">薬の名前</h2><p class="sub center">「薬に名前を付ける」を押してね。</p>`;
   if(state.revealIndex>=state.assignedParts.length)body+=`<div class="potion-name fade">${esc(fullName)}</div>`;
 }
 body+=`</section>`;
 if(state.revealIndex<state.assignedParts.length){
   body+=`<div class="stack">${btn("薬に名前を付ける","reveal-next","primary",state.isRevealing)}</div>`;
 }else if(record && !state.showEffect){
   body+=`<div class="stack">${btn("薬の効果を見る","reveal-effect")}</div>`;
 }else{
   body+=`<div class="stack">${btn("投票","start-voting")}</div>`;
 }
 setScreen(body,`第${state.round}/${state.rounds}ラウンド`);
}
function nextReveal(){
 if(state.isRevealing || state.revealIndex>=state.assignedParts.length)return;
 state.isRevealing=true;
 const step=()=>{
   state.revealIndex++;
   state.isRevealing=false;
   renderReveal();
   if(state.revealIndex<state.assignedParts.length){
     state.isRevealing=true;
     setTimeout(step,650);
   }
 };
 step();
}
function revealEffect(){
 state.showEffect=true;
 renderReveal();
}
function startVotingIntro(){
 state.voteIndex=0;state.votes=[];state.selectedVote=null;
 setScreen(`<section class="panel hero" style="margin-top:4vh"><div class="big-emoji">🗳️</div><h2>1番おかしな材料を<br>入れた研究者を選べ！</h2><p class="sub">自分以外の研究者から1人を選んでね。</p><div class="stack">${btn("投票する","begin-vote-turn")}</div></section>`,`第${state.round}/${state.rounds}ラウンド`);
}
function currentVoter(){return playerById(state.voters[state.voteIndex]);}
function beginVoteTurn(){
 if(state.voteIndex>=state.voters.length){showVoteResults();return;}
 passScreen(currentVoter().name,"投票する","show-ballot","他の人に投票内容を見られないようにしてね。");
}
function showBallot(){
 const voter=currentVoter();
 const options=state.picks.filter(p=>p.playerId!==voter.id);
 state.selectedVote=null;
 setScreen(`<h2>🗳️ 1番おかしな材料を入れた研究者を選べ！</h2><p class="sub center">${esc(voter.name)}さんの投票</p>
 <div>${options.map(p=>{const pl=playerById(p.playerId);return `<button class="vote-option" data-action="select-vote" data-player="${p.playerId}"><span class="material-emoji">${p.material.emoji||MATERIALS.find(m=>m[0]===p.material.name)?.[1]||"🧪"}</span><span><span class="vote-name">${esc(pl.name)}</span><br><span class="vote-material">材料：${esc(p.material.name)}</span></span><span class="mark">${state.selectedVote===p.playerId?"✓":"○"}</span></button>`;}).join("")}</div>
 <div class="stack">${btn("票を入れる","confirm-vote","primary",true)}</div>
 <p class="small center">自分自身には投票できません。</p>`,`第${state.round}/${state.rounds}ラウンド`);
}
function confirmVote(){
 if(state.selectedVote===null)return;
 state.votes.push({voterId:currentVoter().id,targetId:state.selectedVote});
 state.voteIndex++;
 if(state.voteIndex<state.voters.length)beginVoteTurn();else showVoteResults();
}
function voteCounts(){
 const counts={};state.players.forEach(p=>counts[p.id]=0);
 state.votes.forEach(v=>counts[v.targetId]++);
 return counts;
}
function showVoteResults(){
 const counts=voteCounts();
 const ranked=state.players.map(p=>({...p,votes:counts[p.id]})).sort((a,b)=>b.votes-a.votes||a.name.localeCompare(b.name,"ja"));
 let previousVotes=null,rank=0;
 ranked.forEach((p,i)=>{if(p.votes!==previousVotes)rank=i+1;previousVotes=p.votes;p.roundRank=rank;p.roundPoints=rank===1?2:rank===2?1:0;});
 ranked.forEach(p=>{const original=playerById(p.id);original.score+=p.roundPoints;original.roundScores.push(p.roundPoints);});
 const name=state.assignedParts.map(x=>x.part).join(" ")+" 薬";
 state.history.push({round:state.round,name,effects:[...state.effects],picks:state.picks.map(p=>({playerId:p.playerId,material:p.material.name,emoji:p.material.emoji||MATERIALS.find(m=>m[0]===p.material.name)?.[1]||"🧪",part:state.assignedParts[state.picks.findIndex(x=>x.playerId===p.playerId)].part})),ranked:ranked.map(p=>({id:p.id,name:p.name,votes:p.votes,points:p.roundPoints}))});
 const rows=ranked.map((p,i)=>`<div class="score-row"><span>${p.votes>0&&i===0?"🏆":p.votes>0&&p.roundPoints===1?"🥈":"🧪"}</span><div><strong>${esc(p.name)}</strong><div class="small">${p.votes}票 · ${p.roundRank}位</div></div><div class="score">+${p.roundPoints}点</div></div>`).join("");
 const last=state.round>=state.rounds;
 setScreen(`<section class="panel"><div class="big-emoji">🏆</div><h2 class="center">この研究者が最高！</h2><p class="sub center">第${state.round}ラウンドの結果</p><hr>${rows}</section><div class="stack">${btn(last?"総合結果":"次のラウンド",last?"overall-results":"next-round")}</div>`,`第${state.round}/${state.rounds}ラウンド`);
}
function rankLabel(votes,ranked){const sorted=[...new Set(ranked.map(p=>p.votes))].sort((a,b)=>b-a);const i=sorted.indexOf(votes);return `${i+1}位`;}
function nextRound(){state.round++;beginRound();}
function overallResults(){
 const ranked=[...state.players].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,"ja"));
 let lastScore=null,rank=0;
 const rows=ranked.map((p,i)=>{if(p.score!==lastScore)rank=i+1;lastScore=p.score;return `<div class="score-row"><span>${rank===1?"👑":rank===2?"🥈":rank===3?"🥉":"🧪"}</span><div><strong>${esc(p.name)}</strong><div class="small">${p.roundScores.map((s,i)=>`R${i+1}:${s}点`).join(" / ")}</div></div><div class="score">${p.score}点</div></div>`;}).join("");
 setScreen(`<section class="panel"><div class="big-emoji">👑</div><h2 class="center">最優秀研究者</h2><p class="sub center">${state.rounds}ラウンドの総合結果</p><hr>${rows}</section><div class="stack">${btn("ゲーム終了","end-game")}</div>`);
}
function resetGame(){state.rounds=3;state.names=["研究者A","研究者B"];state.orderMode="registration";state.round=1;state.players=[];state.history=[];state.usedMaterials=[];state.usedNameParts=[];state.usedEffects=[];titleScreen();}
function handleAction(el){
 const action=el.dataset.action;
 switch(action){
 case "setup":setupScreen();break;
 case "round-minus":state.rounds=Math.max(2,state.rounds-1);setupScreen();break;
 case "round-plus":state.rounds=Math.min(5,state.rounds+1);setupScreen();break;
 case "add-player":if(state.names.length<5){state.names.push(`研究者${String.fromCharCode(65+state.names.length)}`);}setupScreen();break;
 case "remove-player":if(state.names.length>2){state.names.splice(Number(el.dataset.index),1);}setupScreen();break;
 case "order-registration":state.orderMode="registration";setupScreen();break;
 case "order-random":state.orderMode="random";setupScreen();break;
 case "start-game":startGame();break;
 case "show-materials":showMaterials();break;
 case "select-material":{
   const idx=Number(el.dataset.index);state.selectedMaterial={name:state.currentOptions[idx][0],emoji:state.currentOptions[idx][1]};
   document.querySelectorAll(".material").forEach(b=>b.classList.toggle("selected",Number(b.dataset.index)===idx));
   const confirm=document.querySelector('[data-action="confirm-material"]');if(confirm)confirm.disabled=false;
   break;
 }
 case "confirm-material":confirmMaterial();break;
 case "reveal-record":prepareReveal("record");break;
 case "reveal-drink":prepareReveal("drink");break;
 case "reveal-next":nextReveal();break;
 case "reveal-effect":revealEffect();break;
 case "start-voting":startVotingIntro();break;
 case "begin-vote-turn":beginVoteTurn();break;
 case "show-ballot":showBallot();break;
 case "select-vote":{
   state.selectedVote=Number(el.dataset.player);
   document.querySelectorAll(".vote-option").forEach(b=>{const selected=Number(b.dataset.player)===state.selectedVote;b.classList.toggle("selected",selected);const mark=b.querySelector(".mark");if(mark)mark.textContent=selected?"✓":"○";});
   const confirm=document.querySelector('[data-action="confirm-vote"]');if(confirm)confirm.disabled=false;
   break;
 }
 case "confirm-vote":confirmVote();break;
 case "next-round":nextRound();break;
 case "overall-results":overallResults();break;
 case "end-game":resetGame();break;
 }
}
screen.addEventListener("click",e=>{const el=e.target.closest("[data-action]");if(el&&!el.disabled)handleAction(el);});
screen.addEventListener("change",e=>{
 const el=e.target.closest("[data-name-index]");
 if(el){state.names[Number(el.dataset.nameIndex)]=el.value.trim().slice(0,10);}
});
titleScreen();
</script>
</body>
</html>
